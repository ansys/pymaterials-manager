version: 2
updates:
  - package-ecosystem: "uv"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "maintenance"
      - "dependencies"
    groups:
      doc-deps:
        patterns:
        - "*sphinx*"
        - "numpydoc"
      dev-deps:
        patterns:
        - "pytest*"
        - "pre-commit"
        - "twine"

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "daily"
    groups:
       actions:
          patterns:
            - "*"
